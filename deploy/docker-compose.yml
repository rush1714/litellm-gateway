services:
  postgres:
    image: postgres:16-alpine
    container_name: litellm-postgres
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-litellm}"
      POSTGRES_USER: "${POSTGRES_USER:-litellm}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-litellm-change-me}"
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - litellm-postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-litellm} -d $${POSTGRES_DB:-litellm}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  litellm:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: litellm-gateway:local
    container_name: litellm-gateway
    env_file:
      - "${COMPOSE_PROJECT_ENV_FILE:-../.env}"
    environment:
      LITELLM_CONFIG: /app/config/litellm.yaml
      LITELLM_RUNTIME_CONFIG: /tmp/litellm-runtime.yaml
      LITELLM_PORT: "${LITELLM_PORT:-4001}"
      LITELLM_USE_ICA_PROXY: "${LITELLM_USE_ICA_PROXY:-true}"
      ICA_PROXY_HOST: "127.0.0.1"
      ICA_PROXY_PORT: "${ICA_PROXY_PORT:-4101}"
      OLLAMA_API_BASE: "${OLLAMA_DOCKER_API_BASE:-http://host.docker.internal:11434}"
      DATABASE_URL: "${LITELLM_DOCKER_DATABASE_URL:-postgresql://litellm:litellm-change-me@postgres:5432/litellm?sslmode=disable}"
      NO_PROXY: "${NO_PROXY:-localhost,127.0.0.1,::1}"
      no_proxy: "${no_proxy:-localhost,127.0.0.1,::1}"
    ports:
      - "${LITELLM_PORT:-4001}:${LITELLM_PORT:-4001}"
    extra_hosts:
      - "litellm.top:host-gateway"
    volumes:
      - ../config/litellm.yaml:/app/config/litellm.yaml:ro
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS -H \"Authorization: Bearer $$LITELLM_MASTER_KEY\" http://localhost:$${LITELLM_PORT:-4001}/health >/dev/null || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  litellm-postgres-data:
