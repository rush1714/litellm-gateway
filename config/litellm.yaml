general_settings:
  master_key: "os.environ/LITELLM_MASTER_KEY"
  database_url: "os.environ/DATABASE_URL"
  store_model_in_db: true
  store_prompts_in_spend_logs: true
  disable_env_credential_login: true
router_settings:
  routing_strategy: simple-shuffle
  num_retries: 2
  timeout: 180
  redis_host: "os.environ/REDIS_HOST"
  redis_port: "os.environ/REDIS_PORT"
  redis_password: "os.environ/REDIS_PASSWORD"
  ######################################################
  # Service / Error Fallbacks (Using exact model IDs)
  ######################################################
  fallbacks:
    # ==================================================
    # Gemini Models (Mainline)
    # ==================================================
    - gemini-3.7-flash:
        - gemini-3.6-flash
        - gemini-3.5-flash
        - GLM-5.3
    - gemini-3.6-flash:
        - gemini-3.7-flash
        - gemini-3.5-flash
        - GLM-5.3
    - gemini-3.5-flash:
        - gemini-3.6-flash
        - gemini-3.7-flash
        - GLM-5.3
    # ==================================================
    # Zhipu GLM Models (Mainline)
    # ==================================================
    - GLM-5.3:
        - gemini-3.7-flash
        - gemini-3.6-flash
        - gemini-3.5-flash
litellm_settings:
  drop_params: true
  use_chat_completions_url_for_anthropic_messages: true
  cache: true
  cache_params:
    type: redis
    host: "os.environ/REDIS_HOST"
    port: "os.environ/REDIS_PORT"
    password: "os.environ/REDIS_PASSWORD"
    namespace: "litellm.caching.caching"
########################################################
# Models (Exact 1:1 original model IDs from models.json)
########################################################
model_list:
  ########################################################
  # ======================================================
  # Gemini Models
  # ======================================================
  ########################################################
  - model_name: gemini-3.7-flash
    litellm_params:
      model: openai/gemini-3.7-flash
      api_base: "os.environ/ICA_BASE"
      api_key: "os.environ/ICA_KEY"
      context_window: 1048576
  - model_name: gemini-3.6-flash
    litellm_params:
      model: openai/gemini-3.6-flash
      api_base: "os.environ/ICA_BASE"
      api_key: "os.environ/ICA_KEY"
      context_window: 1048576
  - model_name: gemini-3.5-flash
    litellm_params:
      model: openai/gemini-3.5-flash
      api_base: "os.environ/ICA_BASE"
      api_key: "os.environ/ICA_KEY"
      context_window: 1048576
  ########################################################
  # ======================================================
  # Zhipu GLM Models
  # ======================================================
  ########################################################
  - model_name: GLM-5.3
