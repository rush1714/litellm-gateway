  - model_name: local-gemma3-12b
    litellm_params:
      model: ollama/gemma3:12b
      api_base: "os.environ/OLLAMA_API_BASE"
  - model_name: local-gemma4-12b
    litellm_params:
      model: ollama/gemma4:12b
      api_base: "os.environ/OLLAMA_API_BASE"
  - model_name: local-minicpm-v
    litellm_params:
      model: ollama/minicpm-v:latest
      api_base: "os.environ/OLLAMA_API_BASE"
  - model_name: local-nomic-embed
    litellm_params:
      model: ollama/nomic-embed-text:latest
      api_base: "os.environ/OLLAMA_API_BASE"
########################################################
# Router
########################################################
router_settings:
  num_retries: 2
  timeout: 180
  fallbacks:
    # Claude-compatible aliases
    - claude-sonnet-5:
        - claude-opus-4-8
        - gemini-best
        - gemini
        - llama
    - claude-sonnet-4-5:
        - claude-opus-4-8
        - gemini-best
        - gemini
        - llama
    - claude-opus-4-8:
        - gpt-coding
        - gemini
        - llama
    - claude-opus-4-5:
        - gpt-coding
        - gemini
        - llama
    - claude-haiku-4-5:
        - gemini-fast
        - granite
        - llama
    # Custom aliases by intended use
    - gpt-best:
        - gpt-coding
        - gemini-best
        - gemini
        - llama
    - gpt-coding:
        - gpt-best
        - gemini-best
        - gemini
        - llama
    - gpt-fast:
        - gemini-fast
        - granite
        - llama
    - gpt-multimodal:
        - gemini
        - gpt-best
        - llama
    - gpt-4o:
        - gemini
        - gpt-best
        - llama
    - gemini:
        - gemini-best
        - llama
        - gpt-best
    - gemini-best:
        - gemini
        - gpt-best
        - llama
    - gemini-fast:
        - gpt-fast
        - granite
        - llama
    - llama:
        - gemini
        - gpt-coding
        - granite
    - IBM-Consulting-Banking-BIAN-llama3.1-8b:
        - llama
        - gemini-best
    - IBM-Consulting-TMF-llama3.1-8b:
        - llama
        - gemini-best
    - gemma:
        - gemini-best
        - gemini-fast
        - granite
    - granite:
        - gpt-fast
        - llama
  context_window_fallbacks:
    - claude-sonnet-5:
        - gemini
        - llama
    - claude-sonnet-4-5:
        - gemini
        - llama
    - claude-opus-4-8:
        - gemini
        - llama
    - claude-opus-4-5:
        - gemini
        - llama
    - gpt-best:
        - gemini
        - llama
    - gpt-coding:
        - gemini
        - llama
    - gpt-fast:
        - gemini
        - llama
    - gemini-fast:
        - gemini
        - llama
    - gemini-best:
        - gemini
        - llama
    - granite:
        - gemini
        - llama
