general_settings:
  master_key: "os.environ/LITELLM_MASTER_KEY"
  database_url: "os.environ/DATABASE_URL"
  store_model_in_db: true
  store_prompts_in_spend_logs: true
litellm_settings:
  drop_params: true
########################################################
# Models
########################################################
model_list:
  ########################################################
  # Claude-compatible aliases for Claude Code clients
  ########################################################
  - model_name: claude-sonnet-5
    litellm_params:
      model: openai/gpt-5.6-terra-dzus
      api_base: "os.environ/ICA_PROXY_BASE"
      api_key: "os.environ/ICA_KEY"
  - model_name: claude-sonnet-4-5
    litellm_params:
      model: openai/gpt-5.6-terra-dzus
      api_base: "os.environ/ICA_PROXY_BASE"
      api_key: "os.environ/ICA_KEY"
  - model_name: claude-opus-4-8
    litellm_params:
      model: openai/gpt-5.5-gus
      api_base: "os.environ/ICA_BASE"
      api_key: "os.environ/ICA_KEY"
  - model_name: claude-opus-4-5
    litellm_params:
      model: openai/gpt-5.5-gus
      api_base: "os.environ/ICA_BASE"
      api_key: "os.environ/ICA_KEY"
  - model_name: claude-haiku-4-5
    litellm_params:
      model: openai/gpt-5.6-luna-dzus
      api_base: "os.environ/ICA_PROXY_BASE"
      api_key: "os.environ/ICA_KEY"
  ########################################################
  # Best-use custom aliases from docs/can-use-models-list.md
  ########################################################
  - model_name: gpt-best
    litellm_params:
      model: openai/gpt-5.5-gus
      api_base: "os.environ/ICA_BASE"
      api_key: "os.environ/ICA_KEY"
      context_window: 1050000
  - model_name: gpt-coding
    litellm_params:
      model: openai/gpt-5.6-terra-dzus
      api_base: "os.environ/ICA_PROXY_BASE"
      api_key: "os.environ/ICA_KEY"
      context_window: 1050000
  - model_name: gpt-fast
    litellm_params:
      model: openai/gpt-5.6-luna-dzus
      api_base: "os.environ/ICA_PROXY_BASE"
      api_key: "os.environ/ICA_KEY"
      context_window: 1050000
  - model_name: gpt-multimodal
    litellm_params:
      model: openai/gpt-4o
      api_base: "os.environ/ICA_BASE"
      api_key: "os.environ/ICA_KEY"
      context_window: 1050000
  - model_name: gpt-4o
    litellm_params:
      model: openai/gpt-4o
      api_base: "os.environ/ICA_BASE"
      api_key: "os.environ/ICA_KEY"
      context_window: 1050000
  ########################################################
  # Long-context and guided-task aliases
  ########################################################
  - model_name: gemini
    litellm_params:
      model: openai/gemini-3.1-pro-preview
      api_base: "os.environ/ICA_BASE"
      api_key: "os.environ/ICA_KEY"
  - model_name: gemini-fast
    litellm_params:
      model: openai/gemini-3.5-flash
      api_base: "os.environ/ICA_BASE"
      api_key: "os.environ/ICA_KEY"
  - model_name: gemini-best
    litellm_params:
      model: openai/gemini-3.6-flash
      api_base: "os.environ/ICA_BASE"
      api_key: "os.environ/ICA_KEY"
  - model_name: llama
    litellm_params:
      model: openai/meta-llama/llama-4-maverick-17b-128e-instruct-fp8
      api_base: "os.environ/ICA_BASE"
      api_key: "os.environ/ICA_KEY"
  ########################################################
  # Long-context IBM Consulting
  ########################################################
  - model_name: IBM-Consulting-Banking-BIAN-llama3.1-8b
    litellm_params:
      model: openai/BIAN-llama3.1-8b:260213_pad_free_assistant_only
      api_base: "os.environ/ICA_BASE"
      api_key: "os.environ/ICA_KEY"
  - model_name: IBM-Consulting-TMF-llama3.1-8b
    litellm_params:
      model: openai/TMF-llama3.1-8b:251028_no_sys_prompt
      api_base: "os.environ/ICA_BASE"
      api_key: "os.environ/ICA_KEY"
  ########################################################
  # Small and preview model aliases
  ########################################################
  - model_name: granite
    litellm_params:
      model: openai/ibm/granite-4-h-small
      api_base: "os.environ/ICA_BASE"
      api_key: "os.environ/ICA_KEY"
  - model_name: gemma
    litellm_params:
      model: openai/gemma-4-26b-a4b-it
      api_base: "os.environ/ICA_BASE"
      api_key: "os.environ/ICA_KEY"
  ########################################################
