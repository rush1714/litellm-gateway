      api_base: "os.environ/OLLAMA_API_BASE"
  - model_name: local-qwen-fast
    litellm_params:
      model: ollama/qwen2.5:7b
      api_base: "os.environ/OLLAMA_API_BASE"
  - model_name: local-qwen-coder
    litellm_params:
      model: ollama/qwen2.5-coder:7b
      api_base: "os.environ/OLLAMA_API_BASE"
  - model_name: local-qwen-coder-base
    litellm_params:
      model: ollama/qwen2.5-coder:1.5b-base
      api_base: "os.environ/OLLAMA_API_BASE"
  - model_name: local-llama-8b
    litellm_params:
      model: ollama/llama3.1:8b
      api_base: "os.environ/OLLAMA_API_BASE"
  - model_name: local-qwen3-fast
    litellm_params:
      model: ollama/qwen3:8b
      api_base: "os.environ/OLLAMA_API_BASE"
  - model_name: local-qwen3-14b
    litellm_params:
      model: ollama/qwen3:14b
      api_base: "os.environ/OLLAMA_API_BASE"
  - model_name: local-qwen3-4b
    litellm_params:
      model: ollama/qwen3:4b
      api_base: "os.environ/OLLAMA_API_BASE"
  - model_name: local-deepseek-coder-6-7b
    litellm_params:
      model: ollama/deepseek-coder:6.7b
      api_base: "os.environ/OLLAMA_API_BASE"
  - model_name: local-deepseek-r1-8b
    litellm_params:
      model: ollama/deepseek-r1:8b
      api_base: "os.environ/OLLAMA_API_BASE"
  - model_name: local-mistral-7b
    litellm_params:
      model: ollama/mistral:7b
      api_base: "os.environ/OLLAMA_API_BASE"
  - model_name: local-phi4
