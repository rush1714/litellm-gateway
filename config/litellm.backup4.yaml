      model: openai/ibm/granite-4-h-small
      api_base: "os.environ/ICA_BASE"
      api_key: "os.environ/ICA_KEY"
      context_window: 20480

  ########################################################
  # ======================================================
  # IBM Specialized Domain Models
  # ======================================================
  ########################################################

  - model_name: BIAN-llama3.1-8b:260213_pad_free_assistant_only
