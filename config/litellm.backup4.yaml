########################################################
# Router
########################################################
router_settings:
  num_retries: 2
  timeout: 180

  ######################################################
  # Service / Error Fallbacks (Using exact model IDs)
  ######################################################
  fallbacks:

    # ==================================================
    # Gemini Models
    # ==================================================
    - gemini-3.7-flash:
        - mistral-medium-2505
        - gemini-3.6-flash
        - meta-llama/llama-4-maverick-17b-128e-instruct-fp8
        - meta-llama/llama-3-3-70b-instruct

    - gemini-3.6-flash:
        - gemini-3.7-flash
        - mistral-medium-2505
        - meta-llama/llama-4-maverick-17b-128e-instruct-fp8

    - gemini-3.5-flash:
        - gemini-3.6-flash
        - nvidia/nemotron-3.5-lightning
        - gemma-4-26b-a4b-it
        - ibm/granite-4-h-small

    # ==================================================
    # Mistral Medium
    # ==================================================
    - mistral-medium-2505:
        - gemini-3.7-flash
        - gemini-3.6-flash
        - meta-llama/llama-4-maverick-17b-128e-instruct-fp8

    # ==================================================
    # NVIDIA Nemotron
    # ==================================================
    - nvidia/nemotron-3.5-lightning:
        - gemini-3.7-flash
        - gemini-3.6-flash
        - gemini-3.5-flash

    # ==================================================
    # Meta Llama Models
    # ==================================================
    - meta-llama/llama-4-maverick-17b-128e-instruct-fp8:
        - gemini-3.7-flash
        - mistral-medium-2505
        - gemini-3.6-flash

    - meta-llama/llama-3-3-70b-instruct:
        - meta-llama/llama-4-maverick-17b-128e-instruct-fp8
        - gemini-3.7-flash
        - gemini-3.6-flash

    # ==================================================
    # Small & Preview Models
    # ==================================================
    - gemma-4-26b-a4b-it:
        - gemini-3.5-flash
        - nvidia/nemotron-3.5-lightning
        - ibm/granite-4-h-small

    - ibm/granite-4-h-small:
        - gemini-3.5-flash
        - nvidia/nemotron-3.5-lightning

    # ==================================================
    # IBM Specialized Domain Models
    # ==================================================
    - BIAN-llama3.1-8b:260213_pad_free_assistant_only:
        - meta-llama/llama-4-maverick-17b-128e-instruct-fp8
        - gemini-3.7-flash
        - gemini-3.6-flash

    - TMF-llama3.1-8b:251028_no_sys_prompt:
        - meta-llama/llama-4-maverick-17b-128e-instruct-fp8
        - gemini-3.7-flash
        - gemini-3.6-flash

  ######################################################
  # Context Window Fallbacks (Route small context -> 1M Gemini)
  ######################################################
  context_window_fallbacks:

    - mistral-medium-2505:
        - gemini-3.7-flash
        - gemini-3.6-flash

    - meta-llama/llama-4-maverick-17b-128e-instruct-fp8:
        - gemini-3.7-flash
        - gemini-3.6-flash

    - meta-llama/llama-3-3-70b-instruct:
        - gemini-3.7-flash
        - gemini-3.6-flash

    - gemma-4-26b-a4b-it:
        - gemini-3.7-flash
        - gemini-3.6-flash

    - ibm/granite-4-h-small:
        - gemini-3.7-flash
        - gemini-3.6-flash

    - BIAN-llama3.1-8b:260213_pad_free_assistant_only:
        - gemini-3.7-flash
        - gemini-3.6-flash

    - TMF-llama3.1-8b:251028_no_sys_prompt:
        - gemini-3.7-flash
        - gemini-3.6-flash
