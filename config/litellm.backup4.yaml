general_settings:
  master_key: "os.environ/LITELLM_MASTER_KEY"
  database_url: "os.environ/DATABASE_URL"
  store_model_in_db: true
  store_prompts_in_spend_logs: true

litellm_settings:
  drop_params: true

########################################################
# Models (Exact 1:1 original model IDs from models.json)
########################################################
model_list:

  ########################################################
  # ======================================================
  # Gemini Models
  # ======================================================
  ########################################################

  - model_name: gemini-3.7-flash
    litellm_params:
      model: openai/gemini-3.7-flash
      api_base: "os.environ/ICA_BASE"
      api_key: "os.environ/ICA_KEY"
      context_window: 1048576

  - model_name: gemini-3.6-flash
    litellm_params:
      model: openai/gemini-3.6-flash
      api_base: "os.environ/ICA_BASE"
      api_key: "os.environ/ICA_KEY"
      context_window: 1048576

  - model_name: gemini-3.5-flash
    litellm_params:
      model: openai/gemini-3.5-flash
      api_base: "os.environ/ICA_BASE"
      api_key: "os.environ/ICA_KEY"
      context_window: 1048576

  ########################################################
  # ======================================================
  # Mistral Models
  # ======================================================
  ########################################################

  - model_name: mistral-medium-2505
    litellm_params:
      model: openai/mistral-medium-2505
      api_base: "os.environ/ICA_BASE"
      api_key: "os.environ/ICA_KEY"

  ########################################################
  # ======================================================
  # NVIDIA Models
  # ======================================================
  ########################################################

  - model_name: nvidia/nemotron-3.5-lightning
    litellm_params:
      model: openai/nvidia/nemotron-3.5-lightning
      api_base: "os.environ/ICA_BASE"
      api_key: "os.environ/ICA_KEY"

  ########################################################
  # ======================================================
  # Meta Llama Models
  # ======================================================
  ########################################################

  - model_name: meta-llama/llama-4-maverick-17b-128e-instruct-fp8
    litellm_params:
      model: openai/meta-llama/llama-4-maverick-17b-128e-instruct-fp8
      api_base: "os.environ/ICA_BASE"
      api_key: "os.environ/ICA_KEY"

  - model_name: meta-llama/llama-3-3-70b-instruct
    litellm_params:
      model: openai/meta-llama/llama-3-3-70b-instruct
      api_base: "os.environ/ICA_BASE"
      api_key: "os.environ/ICA_KEY"

  ########################################################
  # ======================================================
  # Google Gemma & IBM Granite Models
  # ======================================================
  ########################################################

  - model_name: gemma-4-26b-a4b-it
    litellm_params:
      model: openai/gemma-4-26b-a4b-it
      api_base: "os.environ/ICA_BASE"
      api_key: "os.environ/ICA_KEY"

  - model_name: ibm/granite-4-h-small
